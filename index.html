<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>roleplay.ai</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<h1>roleplay.ai</h1>

<div class="box">
<h2>⚙️ Cuenta</h2>

<button id="google">🔵 Entrar con Google</button>
<button id="email">✉️ Entrar con Email</button>

<p id="estado">Sin sesión</p>

<h2>🤖 Crear IA</h2>
<input id="nombre" placeholder="Nombre IA">
<textarea id="prompt" placeholder="Personalidad"></textarea>

<button id="guardar">Publicar IA en Firebase</button>
<button id="borrar">🗑️ BORRAR HISTORIAL ⚠️</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { 
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getDatabase,
 ref,
 set,
 push,
 remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
 apiKey: "AIzaSyBTF20PW-k1pNBciHthbcJKF9lCUW9Yu30",
 authDomain: "oeu-----------oeu-o-e-u.firebaseapp.com",
 projectId: "oeu-----------oeu-o-e-u",
 storageBucket: "oeu-----------oeu-o-e-u.firebasestorage.app",
 messagingSenderId: "697173046083",
 appId: "1:697173046083:web:2d8c2500abd344feb435f6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user=null;

onAuthStateChanged(auth,u=>{
 user=u;
 estado.textContent=u ? "Sesión: "+u.email : "Sin sesión";
});

google.onclick=async()=>{
 await signInWithPopup(auth,new GoogleAuthProvider());
};

guardar.onclick=async()=>{
 if(!user)return alert("Inicia sesión primero");

 let id=push(ref(db,"users/"+user.uid+"/bots")).key;

 await set(ref(db,"users/"+user.uid+"/bots/"+id),{
  nombre:nombre.value,
  prompt:prompt.value,
  historial:{}
 });

 console.log("IA publicada");
};

borrar.onclick=async()=>{
 if(!user)return;
 await remove(ref(db,"users/"+user.uid+"/bots"));
 console.log("Historial borrado");
};

</script>

</body>
</html>
